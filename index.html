<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <title>Eu Te Amo ❤️</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        body {
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
        }

        /* Área principal */
        .container {
            position: relative;

            /* Responsivo para celular */
            width: min(94vw, 600px);
            height: min(94vw, 600px);

            max-width: 600px;
            max-height: 600px;
        }

        /* Área onde o coração será desenhado */
        .heart-text {
            position: absolute;
            width: 100%;
            height: 100%;
            inset: 0;
        }

        /* Cada "eu te amo" */
        .word {
            position: absolute;

            color: #ffb6c1;

            /*
             * Tamanho responsivo:
             * celular = menor
             * tela grande = maior
             */
            font-size: clamp(8px, 3.1vw, 18px);

            font-weight: bold;
            white-space: nowrap;

            text-shadow:
                0 0 4px #ff69b4,
                0 0 8px #ff69b4,
                0 0 15px #ff69b4;
        }

        /* Foto */
        .photo {
            position: absolute;

            width: 38%;
            height: 38%;

            left: 50%;
            top: 50%;

            transform: translate(-50%, -50%);

            object-fit: cover;

            border-radius: 50%;

            border: clamp(2px, 1vw, 5px) solid #ffb6c1;

            box-shadow:
                0 0 10px #ff69b4,
                0 0 25px #ff69b4,
                0 0 45px #ff69b4;

            animation: pulse 2s infinite ease-in-out;
        }

        /* Texto abaixo */
        .message {
            position: absolute;

            left: 50%;
            bottom: -7%;

            transform: translateX(-50%);

            width: 100%;

            text-align: center;

            color: #ffb6c1;

            font-size: clamp(16px, 5vw, 26px);

            font-weight: bold;

            text-shadow:
                0 0 8px #ff69b4,
                0 0 18px #ff69b4;
        }

        /* Animação da foto */
        @keyframes pulse {

            0%,
            100% {
                transform: translate(-50%, -50%) scale(1);
            }

            50% {
                transform: translate(-50%, -50%) scale(1.05);
            }
        }

        /*
         * Ajustes específicos para celulares
         */

        @media (max-width: 500px) {

            .container {
                width: 92vw;
                height: 92vw;
            }

            .word {
                font-size: clamp(7px, 2.8vw, 13px);
            }

            .photo {
                width: 37%;
                height: 37%;
            }

            .message {
                bottom: -9%;
            }
        }

        /*
         * Celulares com telas mais estreitas
         */

        @media (max-width: 380px) {

            .container {
                width: 94vw;
                height: 94vw;
            }

            .word {
                font-size: 7px;
            }

            .photo {
                width: 35%;
                height: 35%;
            }

            .message {
                font-size: 18px;
            }
        }

        /*
         * Quando o celular estiver deitado
         */

        @media (orientation: landscape) and (max-height: 500px) {

            .container {
                width: 80vh;
                height: 80vh;
            }

            .message {
                display: none;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <!-- Coração -->
        <div class="heart-text" id="heartText"></div>

        <!-- FOTO -->
        <!-- Coloque sua foto com o nome foto.jpg -->
        <img
            src="foto.jpeg"
            class="photo"
            alt="Nossa foto"
        >

        <!-- Mensagem -->
        <div class="message">
            ❤️ Eu te amo ❤️
        </div>

    </div>


    <script>

        const heart = document.getElementById("heartText");

        /*
         * Quantidade de frases.
         * Quanto maior, mais preenchido fica o coração.
         */
        const quantidade = 110;


        for (let i = 0; i < quantidade; i++) {

            /*
             * Ângulo do coração
             */
            const t = (Math.PI * 2 * i) / quantidade;


            /*
             * Fórmula matemática do coração
             */
            const x =
                16 * Math.pow(Math.sin(t), 3);


            const y =
                13 * Math.cos(t)
                - 5 * Math.cos(2 * t)
                - 2 * Math.cos(3 * t)
                - Math.cos(4 * t);


            /*
             * Cria a frase
             */
            const texto = document.createElement("div");

            texto.className = "word";

            texto.innerText = "eu te amo";


            /*
             * Como o coração usa porcentagem,
             * ele acompanha automaticamente
             * o tamanho da tela.
             */
            const posX =
                50 + (x / 18) * 50;


            const posY =
                48 - (y / 18) * 50;


            texto.style.left = posX + "%";

            texto.style.top = posY + "%";


            /*
             * Rotação da frase acompanhando
             * o formato do coração
             */
            const dx =
                48 *
                Math.pow(Math.sin(t), 2) *
                Math.cos(t);


            const dy =
                -13 * Math.sin(t)
                + 10 * Math.sin(2 * t)
                + 6 * Math.sin(3 * t)
                + 4 * Math.sin(4 * t);


            const angulo =
                Math.atan2(-dy, dx);


            texto.style.transform =
                `translate(-50%, -50%) rotate(${angulo}rad)`;


            /*
             * Adiciona ao coração
             */
            heart.appendChild(texto);
        }

    </script>

</body>

</html>
