<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <title>Eu Te Amo ❤️</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        body {
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
        }

        .container {
            position: relative;
            width: min(94vw, 600px);
            height: min(94vw, 600px);
        }

        .heart-text {
            position: absolute;
            width: 100%;
            height: 100%;
            inset: 0;
        }

        .word {
            position: absolute;

            color: #ffb6c1;

            /* Sempre horizontal */
            transform: translate(-50%, -50%);

            white-space: nowrap;

            font-size: clamp(8px, 2.8vw, 15px);

            font-weight: bold;

            text-shadow:
                0 0 5px #ff69b4,
                0 0 10px #ff69b4,
                0 0 20px #ff69b4;
        }

        /* FOTO NO CENTRO */
        .photo {
            position: absolute;

            width: 38%;
            height: 38%;

            left: 50%;
            top: 50%;

            transform: translate(-50%, -50%);

            object-fit: cover;

            border-radius: 50%;

            border: 4px solid #ffb6c1;

            box-shadow:
                0 0 10px #ff69b4,
                0 0 25px #ff69b4,
                0 0 50px #ff69b4;

            animation: pulse 2s infinite ease-in-out;
        }

        .message {
            position: absolute;

            left: 50%;
            bottom: -8%;

            transform: translateX(-50%);

            width: 100%;

            text-align: center;

            color: #ffb6c1;

            font-size: clamp(16px, 5vw, 26px);

            font-weight: bold;

            text-shadow:
                0 0 10px #ff69b4,
                0 0 20px #ff69b4;
        }

        @keyframes pulse {

            0%,
            100% {
                transform: translate(-50%, -50%) scale(1);
            }

            50% {
                transform: translate(-50%, -50%) scale(1.05);
            }
        }

        /* CELULAR */
        @media (max-width: 500px) {

            .container {
                width: 94vw;
                height: 94vw;
            }

            .word {
                font-size: clamp(7px, 2.6vw, 13px);
            }

            .photo {
                width: 37%;
                height: 37%;
            }
        }

        /* CELULARES MENORES */
        @media (max-width: 380px) {

            .container {
                width: 95vw;
                height: 95vw;
            }

            .word {
                font-size: 7px;
            }

            .photo {
                width: 35%;
                height: 35%;
            }

            .message {
                font-size: 18px;
            }
        }

        /* MODO PAISAGEM */
        @media (orientation: landscape) and (max-height: 500px) {

            .container {
                width: 80vh;
                height: 80vh;
            }

            .message {
                display: none;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="heart-text" id="heartText"></div>

        <!-- SUA FOTO -->
        <img src="foto.jpg" class="photo" alt="Nossa foto">

        <div class="message">
            ❤️ Eu te amo ❤️
        </div>

    </div>


    <script>

        const heart = document.getElementById("heartText");

        /*
         * Quantidade de "eu te amo"
         */
        const quantidade = 125;


        /*
         * Tamanho do coração
         */
        const tamanho = 18;


        for (let i = 0; i < quantidade; i++) {

            /*
             * Ângulo
             */
            const t =
                (Math.PI * 2 * i) / quantidade;


            /*
             * EQUAÇÃO DO CORAÇÃO
             */
            const x =
                16 * Math.pow(Math.sin(t), 3);


            const y =
                13 * Math.cos(t)
                - 5 * Math.cos(2 * t)
                - 2 * Math.cos(3 * t)
                - Math.cos(4 * t);


            /*
             * Cria o texto
             */
            const texto =
                document.createElement("div");


            texto.className = "word";


            texto.innerText =
                "eu te amo";


            /*
             * Converte a posição matemática
             * para porcentagem.
             */
            const posX =
                50 + (x / tamanho) * 50;


            const posY =
                48 - (y / tamanho) * 50;


            texto.style.left =
                posX + "%";


            texto.style.top =
                posY + "%";


            /*
             * IMPORTANTE:
             *
             * NÃO usamos rotate().
             *
             * Dessa forma todas as frases
             * ficam perfeitamente horizontais.
             */
            texto.style.transform =
                "translate(-50%, -50%)";


            /*
             * Adiciona ao coração
             */
            heart.appendChild(texto);
        }

    </script>

</body>

</html>
